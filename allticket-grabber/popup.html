<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>AllTicket 搶票助手</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      width:340px;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif;
      font-size:13px;background:#f5f5f7;color:#1a1a2e;
    }

    .header{
      background:#fff;border-bottom:3px solid #e74c3c;
      padding:13px 16px;display:flex;align-items:center;gap:10px;
    }
    .header-icon{
      width:36px;height:36px;border-radius:10px;
      background:linear-gradient(135deg,#e74c3c,#c0392b);
      display:flex;align-items:center;justify-content:center;
      font-size:18px;flex-shrink:0;
    }
    .header-text h1{font-size:14px;font-weight:800;color:#1a1a2e}
    .header-text .sub{font-size:10px;color:#999;margin-top:1px}
    .status-dot{
      width:10px;height:10px;border-radius:50%;
      background:#ddd;margin-left:auto;flex-shrink:0;transition:all .3s;
    }
    .status-dot.active{
      background:#27ae60;box-shadow:0 0 0 3px rgba(39,174,96,.2);
      animation:pulse 1.3s infinite;
    }
    @keyframes pulse{
      0%,100%{box-shadow:0 0 0 3px rgba(39,174,96,.2)}
      50%{box-shadow:0 0 0 6px rgba(39,174,96,.05)}
    }

    .card{
      background:#fff;margin:8px 12px 0;border-radius:10px;
      padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.06);
    }
    .status-card{
      background:#fff;margin:10px 12px 0;border-radius:10px;
      padding:10px 14px;box-shadow:0 1px 4px rgba(0,0,0,.06);
    }
    .status-row{display:flex;align-items:center;gap:8px}
    .status-label{font-size:11px;font-weight:600;color:#aaa}
    #statusText{font-size:12px;font-weight:700;color:#1a1a2e}
    #stepBadge{
      margin-left:auto;font-size:10px;font-weight:700;
      padding:2px 9px;border-radius:20px;
      background:#fff0f0;color:#e74c3c;border:1px solid #f5c6c6;
    }
    #pageHint{margin-top:5px;font-size:10px;color:#aaa}
    .page-tag{
      background:#f0f4ff;color:#3a5bd9;border-radius:4px;
      padding:1px 6px;font-weight:600;font-size:10px;
    }

    .card-title{
      font-size:10px;font-weight:700;color:#e74c3c;
      text-transform:uppercase;letter-spacing:.8px;
      margin-bottom:10px;display:flex;align-items:center;gap:5px;
    }
    .card-title::after{content:'';flex:1;height:1px;background:#fde8e8}

    .field{margin-bottom:9px}
    .field:last-child{margin-bottom:0}
    .field-label{
      font-size:11px;font-weight:600;color:#555;
      margin-bottom:4px;display:flex;align-items:center;gap:5px;
    }
    .field-hint{font-size:10px;color:#bbb;font-weight:400}

    input[type=text],input[type=number],select{
      width:100%;padding:7px 10px;
      background:#f9f9fc;border:1.5px solid #e8e8f0;
      border-radius:7px;color:#1a1a2e;font-size:12px;
      outline:none;transition:border .2s;
      appearance:none;-webkit-appearance:none;
    }
    input:focus,select:focus{
      border-color:#e74c3c;box-shadow:0 0 0 3px rgba(231,76,60,.08);background:#fff;
    }

    .toggle-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
    .toggle-row:last-child{margin-bottom:0}
    .toggle-label{font-size:12px;color:#444;font-weight:500}
    .toggle{position:relative;width:38px;height:20px;flex-shrink:0}
    .toggle input{opacity:0;width:0;height:0}
    .slider{
      position:absolute;inset:0;background:#e0e0e8;
      border-radius:20px;cursor:pointer;transition:.25s;
    }
    .slider::before{
      content:'';position:absolute;width:14px;height:14px;left:3px;top:3px;
      background:#fff;border-radius:50%;transition:.25s;
      box-shadow:0 1px 3px rgba(0,0,0,.2);
    }
    input:checked+.slider{background:#e74c3c}
    input:checked+.slider::before{transform:translateX(18px)}

    .interval-row{display:flex;align-items:center;gap:8px;margin-top:7px}
    .interval-row input{width:70px}
    .interval-row span{font-size:12px;color:#999}

    .btn-start{
      width:100%;padding:11px;
      background:linear-gradient(135deg,#e74c3c,#c0392b);
      color:#fff;font-size:14px;font-weight:800;
      border-radius:9px;border:none;cursor:pointer;
      box-shadow:0 3px 12px rgba(231,76,60,.35);transition:all .2s;
    }
    .btn-start:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(231,76,60,.4)}
    .btn-stop{
      width:100%;padding:11px;background:#f5f5f7;color:#666;
      font-size:13px;font-weight:700;border-radius:9px;
      border:1.5px solid #e0e0e8;cursor:pointer;transition:all .2s;
    }
    .btn-stop:hover{background:#fff0f0;color:#e74c3c;border-color:#f5c6c6}

    .log-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
    .log-title{font-size:10px;font-weight:700;color:#e74c3c;text-transform:uppercase;letter-spacing:.8px}
    #seatCount-badge{
      font-size:10px;font-weight:700;color:#fff;
      background:#e74c3c;padding:2px 8px;border-radius:10px;
    }
    .log-box{
      background:#f9f9fc;border:1.5px solid #ebebf5;
      border-radius:8px;padding:8px 10px;height:95px;
      overflow-y:auto;font-family:'SF Mono',Consolas,monospace;font-size:10.5px;
    }
    .log-box::-webkit-scrollbar{width:4px}
    .log-box::-webkit-scrollbar-thumb{background:#ddd;border-radius:2px}
    .log-entry{margin-bottom:2px;line-height:1.5;color:#999}
    .log-entry.success{color:#27ae60}
    .log-entry.warn{color:#e67e22}
    .log-entry.error{color:#e74c3c}
    .log-entry.info{color:#2980b9}

    .bottom-pad{height:12px}
  </style>
</head>
<body>

<div class="header">
  <div class="header-icon">🎫</div>
  <div class="header-text">
    <h1>AllTicket 搶票助手</h1>
    <div class="sub">allticket.com 專用自動搶票</div>
  </div>
  <div class="status-dot" id="statusDot"></div>
</div>

<div class="status-card">
  <div class="status-row">
    <span class="status-label">狀態</span>
    <span id="statusText">未啟動</span>
    <span id="stepBadge">-</span>
  </div>
  <div id="pageHint" style="margin-top:5px;font-size:10px;color:#aaa">
    目前頁面：<span class="page-tag" id="pageTag">偵測中...</span>
  </div>
</div>

<div class="card" style="margin-top:10px">
  <div id="startWrap">
    <button class="btn-start" id="startBtn">🚀 &nbsp;開始搶票</button>
  </div>
  <div id="stopWrap" style="display:none">
    <button class="btn-stop" id="stopBtn">⏹ &nbsp;停止搶票</button>
  </div>
</div>

<div class="card">
  <div class="card-title">搶票條件</div>
  <div class="field">
    <div class="field-label">
      Zone 關鍵字
      <span class="field-hint">逗號分隔，留空＝自動選有位</span>
    </div>
    <input type="text" id="zoneKeywords" placeholder="如：A1, B1, B2（留空自動選最多空位）">
  </div>
  <div class="field">
    <div class="field-label">
      購買張數
      <span class="field-hint">1~4 張</span>
    </div>
    <input type="number" id="seatCount" value="1" min="1" max="4">
  </div>
</div>

<div class="card">
  <div class="card-title">自動化設定</div>
  <div class="toggle-row">
    <span class="toggle-label">等待開賣自動重整頁面</span>
    <label class="toggle">
      <input type="checkbox" id="autoRefresh">
      <span class="slider"></span>
    </label>
  </div>
  <div class="interval-row">
    <span class="toggle-label" style="font-size:12px;color:#444;font-weight:500">偵測間隔</span>
    <input type="number" id="intervalInput" value="400" min="200" max="3000" step="100">
    <span>毫秒</span>
  </div>
</div>

<div class="card">
  <div class="log-header">
    <div class="log-title">操作記錄</div>
    <span id="seatCount-badge">0 張</span>
  </div>
  <div class="log-box" id="logBox">
    <div class="log-entry info">[系統] 插件載入，請設定後啟動</div>
  </div>
</div>

<div class="bottom-pad"></div>
<script src="popup.js"></script>
</body>
</html>
